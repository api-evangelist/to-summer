name: To Summer
description: >-
  To Summer (观夏 / Guanxia) is a Chinese premium home-fragrance and lifestyle
  brand founded in Beijing, known for its Eastern-inspired scented candles,
  incense, diffusers, perfumes, and bath and body products. Positioned as a
  direct-to-consumer scent brand, it sells primarily through its own website,
  WeChat mini-program, Tmall flagship store, and a growing footprint of
  physical concept stores across China. To Summer is backed by IDG Capital and
  was surfaced through the API Evangelist venture-portfolio pipeline. As a
  consumer retail brand it exposes a customer-facing e-commerce experience
  rather than a public developer API; this profile captures its identity and
  the outcome of an enrichment probe that found no public API surface.
